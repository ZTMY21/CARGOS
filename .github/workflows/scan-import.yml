name: Validar carga de facturas
on:
  pull_request:
    paths:
      - 'src/scan-rows.js'
      - 'src/scan-import-ui.js'
      - 'src/scan-workbook.js'
      - 'src/box-scanner.js'
      - 'src/box-scanner-ui.js'
      - 'api/scan-ingest.js'
      - 'src/app.js'
      - 'index.html'
      - 'tests/scan-import.test.js'
      - 'tests/scan-workbook.test.js'
      - 'tests/box-scanner.test.js'
      - '.github/workflows/scan-import.yml'
  push:
    branches: [feature/carga-facturas-app-20261101, feature/excel-facturas-lotes-20261101, feature/control-cajas-escaner-20261101]
jobs:
  scan-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar dependencias exactas
        run: npm ci
      - name: Probar seguridad, Excel y conciliación
        run: node --test tests/scan-import.test.js tests/scan-workbook.test.js tests/box-scanner.test.js
      - name: Compilar aplicativo con configuración pública ficticia
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_ci_placeholder
        run: npm run build
