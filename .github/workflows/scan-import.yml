name: Validar automatizaciones del Kárdex
on:
  pull_request:
    paths:
      - 'src/scan-rows.js'
      - 'src/scan-import-ui.js'
      - 'src/scan-workbook.js'
      - 'src/box-scanner.js'
      - 'src/box-scanner-ui.js'
      - 'src/box-conditioning-ui.js'
      - 'src/pickup-mail-template.js'
      - 'src/pickup-mail-ui.js'
      - 'src/pickup-mail-demo.js'
      - 'supabase/migrations/20261101230000_pickup_mail_custom_template.sql'
      - 'tests/pickup-mail-demo.test.js'
      - 'api/pickup-mail.js'
      - 'supabase/migrations/20261101210000_pickup_mail.sql'
      - 'supabase/migrations/20261101211500_pickup_mail_auto_queue.sql'
      - 'tests/pickup-mail.test.js'
      - 'tests/pickup-mail-ui.test.js'
      - 'src/box-sheet-sync.js'
      - 'api/box-sheets.js'
      - 'supabase/migrations/20261101195000_box_conditioning.sql'
      - 'api/scan-ingest.js'
      - 'src/app.js'
      - 'index.html'
      - 'tests/scan-import.test.js'
      - 'tests/scan-workbook.test.js'
      - 'tests/box-scanner.test.js'
      - 'tests/box-conditioning.test.js'
      - 'tests/box-sheet-sync.test.js'
      - 'tests/box-sheets-api.test.js'
      - 'tests/pickup-mail.test.js'
      - 'tests/pickup-mail-ui.test.js'
      - 'tests/pickup-mail-demo.test.js'
      - '.github/workflows/scan-import.yml'
  push:
    branches: [feature/carga-facturas-app-20261101, feature/excel-facturas-lotes-20261101, feature/control-cajas-escaner-20261101, feature/acondicionamiento-cajas-20261101, feature/drive-sheets-cajas-y-facturas-20261101, feature/correos-recojo-eml-20261101]
jobs:
  scan-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar dependencias exactas
        run: npm ci
      - name: Probar módulos afectados y navegación del Kárdex
        run: node --test tests/box-scanner.test.js tests/im-requests.test.js tests/im-shipped-summary.test.js tests/scan-import.test.js tests/scan-workbook.test.js tests/box-conditioning.test.js tests/box-sheet-sync.test.js tests/box-sheets-api.test.js tests/pickup-mail.test.js tests/pickup-mail-ui.test.js tests/pickup-mail-demo.test.js
      - name: Compilar aplicativo con configuración pública ficticia
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_ci_placeholder
        run: npm run build
