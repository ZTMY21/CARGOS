name: Validar automatizaciones del Kárdex
on:
  pull_request:
    paths:
      - 'src/scan-rows.js'
      - 'src/scan-import-ui.js'
      - 'src/monthly-created-summary.js'
      - 'tests/monthly-created-summary.test.js'
      - 'supabase/migrations/20261103053000_fix_excel_dual_finalization_receipts.sql'
      - 'src/scan-workbook.js'
      - 'src/scan-cargo-plan.js'
      - 'src/scan-zip-reader.js'
      - 'api/cargo-excel.js'
      - 'server/cargo-excel-book.js'
      - 'tests/scan-cargo-dual.test.js'
      - 'tests/scan-dropzone.test.js'
      - 'tests/excel-import-commit-safety.test.js'
      - 'supabase/migrations/20261103040000_excel_dual_cargos_2026.sql'
      - 'src/box-scanner.js'
      - 'src/box-scanner-ui.js'
      - 'src/box-conditioning-ui.js'
      - 'src/box-scan-sheet-ui.js'
      - 'src/intervention-ui.css'
      - 'src/intervention-premium.css'
      - 'src/intervention-experience.js'
      - 'tests/intervention-premium.test.js'
      - 'tests/intervention-visual.test.js'
      - 'tests/box-separation.test.js'
      - 'src/pickup-mail-template.js'
      - 'src/pickup-mail-ui.js'
      - 'src/pickup-mail-demo.js'
      - 'supabase/migrations/20261101230000_pickup_mail_custom_template.sql'
      - 'tests/pickup-mail-demo.test.js'
      - 'api/pickup-mail.js'
      - 'supabase/migrations/20261101210000_pickup_mail.sql'
      - 'supabase/migrations/20261101211500_pickup_mail_auto_queue.sql'
      - 'tests/pickup-mail.test.js'
      - 'tests/pickup-mail-ui.test.js'
      - 'tests/pickup-mail-visibility.test.js'
      - 'src/box-sheet-sync.js'
      - 'api/box-sheets.js'
      - 'supabase/migrations/20261101195000_box_conditioning.sql'
      - 'api/scan-ingest.js'
      - 'src/app.js'
      - 'src/search.js'
      - 'supabase/migrations/20261103064000_existencias_un_anio_por_cargo.sql'
      - 'tests/app.test.js'
      - 'index.html'
      - 'tests/scan-import.test.js'
      - 'tests/scan-workbook.test.js'
      - 'tests/box-scanner.test.js'
      - 'tests/box-conditioning.test.js'
      - 'tests/box-sheet-sync.test.js'
      - 'tests/box-sheets-api.test.js'
      - 'tests/pickup-mail.test.js'
      - 'tests/pickup-mail-ui.test.js'
      - 'tests/pickup-mail-demo.test.js'
      - '.github/workflows/scan-import.yml'
  push:
    branches: [feature/carga-facturas-app-20261101, feature/excel-facturas-lotes-20261101, feature/control-cajas-escaner-20261101, feature/acondicionamiento-cajas-20261101, feature/drive-sheets-cajas-y-facturas-20261101, feature/correos-recojo-eml-20261101]
jobs:
  scan-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar dependencias exactas
        run: npm ci
      - name: Verificar persistencia de sesión en búsquedas
        run: node --test --test-force-exit --test-name-pattern="session persists beyond one hour" tests/app.test.js
      - name: Verificar año único de Existencias y filtro real de cargos
        run: node --test --test-force-exit --test-name-pattern="Existencias muestra 2026|filtro de año de Existencias|clicking the annual cargo count" tests/app.test.js
      - name: Probar módulos afectados y navegación del Kárdex
        run: node --test tests/box-scanner.test.js tests/im-requests.test.js tests/im-shipped-summary.test.js tests/scan-import.test.js tests/scan-workbook.test.js tests/scan-cargo-dual.test.js tests/scan-dropzone.test.js tests/monthly-created-summary.test.js tests/cargo-expiry.test.js tests/excel-import-commit-safety.test.js tests/box-conditioning.test.js tests/intervention-visual.test.js tests/intervention-premium.test.js tests/box-separation.test.js tests/box-sheet-sync.test.js tests/box-sheets-api.test.js tests/pickup-mail.test.js tests/pickup-mail-ui.test.js tests/pickup-mail-visibility.test.js tests/pickup-mail-demo.test.js
      - name: Verificar sintaxis del backend dual
        run: node --check api/cargo-excel.js && node --check server/cargo-excel-book.js && node --check src/scan-zip-reader.js
      - name: Compilar aplicativo con configuración pública ficticia
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_ci_placeholder
        run: npm run build
